name: Test basic usage - compliant Ruby code passes
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/act-harness
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fixture Ruby project with compliant code
        run: |
          mkdir -p /tmp/ruby-project-good
          printf 'source "https://rubygems.org"\ngem "standard"\n' > /tmp/ruby-project-good/Gemfile
          printf 'puts "hello"\n' > /tmp/ruby-project-good/hello.rb
          cd /tmp/ruby-project-good
          git init
          git config user.email "test@test.com"
          git config user.name "Test"
          git add .
          git commit -m "initial"

      - id: action
        uses: .
        with:
          autofix: 'false'
          workdir: /tmp/ruby-project-good

      - name: Assert action completed successfully
        run: |
          echo "PASS: action completed without error on compliant Ruby code"
