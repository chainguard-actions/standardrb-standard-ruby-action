name: Test clean Ruby code passes
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Standard Ruby on clean code
        id: action
        uses: .
        with:
          ruby-version: '3.3'
          autofix: 'false'
          working-directory: tests/fixtures/good-ruby

      - name: Assert action succeeded
        run: |
          echo "Action completed successfully on clean Ruby code"
          echo "PASS: standardrb found no issues in clean code"
