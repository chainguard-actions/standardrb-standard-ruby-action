name: Test bad Ruby code fails
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Standard Ruby on bad code
        id: action
        uses: .
        with:
          ruby-version: '3.3'
          autofix: 'false'
          working-directory: tests/fixtures/bad-ruby
        continue-on-error: true

      - name: Assert action failed on bad code
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed on bad Ruby code"
          else
            echo "FAIL: expected action to fail on bad Ruby code, got outcome '$OUTCOME'"
            exit 1
          fi
