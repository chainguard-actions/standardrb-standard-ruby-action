name: Test autofix disabled with dirty Ruby code
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          ruby-version: '3.3'
          autofix: 'false'
          workdir: tests/fixtures/dirty-ruby
        continue-on-error: true

      - name: Assert action failed due to style issues
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with dirty Ruby code but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with dirty Ruby code"
