name: Test .ruby-version file detection
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          autofix: 'false'
          workdir: tests/fixtures/ruby-version-file

      - name: Assert action passed using .ruby-version file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed when .ruby-version file is present, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly used .ruby-version file"
