name: Test .ruby-version file detection
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/act-harness
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fixture Ruby project with .ruby-version file
        run: |
          mkdir -p /tmp/ruby-project-version
          printf 'source "https://rubygems.org"\ngem "standard"\n' > /tmp/ruby-project-version/Gemfile
          printf 'puts "hello"\n' > /tmp/ruby-project-version/hello.rb
          echo "3.2" > /tmp/ruby-project-version/.ruby-version
          cd /tmp/ruby-project-version
          git init
          git config user.email "test@test.com"
          git config user.name "Test"
          git add .
          git commit -m "initial"

      - id: action
        uses: .
        with:
          autofix: 'false'
          workdir: /tmp/ruby-project-version

      - name: Assert action completed successfully with .ruby-version file
        run: |
          echo "PASS: action completed without error using .ruby-version file"
