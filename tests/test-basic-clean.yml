name: Test basic usage with clean Ruby code
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          ruby-version: '3.3'
          autofix: 'false'
          workdir: tests/fixtures/clean-ruby

      - name: Assert action passed with clean code
        run: |
          echo "Action completed successfully with clean Ruby code"
          echo "PASS"
