name: Test lint failure - non-compliant Ruby code fails build
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/act-harness
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up fixture Ruby project with non-compliant code
        run: |
          mkdir -p /tmp/ruby-project-bad
          printf 'source "https://rubygems.org"\ngem "standard"\n' > /tmp/ruby-project-bad/Gemfile
          printf 'x=1\ny=2\nputs x+y\n' > /tmp/ruby-project-bad/bad.rb
          cd /tmp/ruby-project-bad
          git init
          git config user.email "test@test.com"
          git config user.name "Test"
          git add .
          git commit -m "initial"

      - id: action
        uses: .
        with:
          autofix: 'false'
          workdir: /tmp/ruby-project-bad
        continue-on-error: true

      - name: Assert action failed due to lint errors
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to lint errors, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed due to lint errors"
