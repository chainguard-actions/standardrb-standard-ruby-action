name: Test default ruby-version input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Standard Ruby action with default ruby-version
        id: action
        uses: .
        with:
          autofix: "false"
        # ruby-version defaults to 'ruby' (latest stable CRuby)
        continue-on-error: true

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: Standard Ruby action completed successfully with default ruby-version"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: Action failed gracefully (sentinel repo not resolvable or env issue)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
